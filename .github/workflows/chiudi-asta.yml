# Chiude l'asta: ferma l'aggiornamento automatico e toglie la pagina dal web.
#
# Da lanciare a mano quando il banditore ha finito — anche dal telefono:
# app GitHub -> Actions -> «Chiudi l'asta» -> Run workflow.
#
# Chiede di scrivere CHIUDI per confermare. Non e' burocrazia: questo tasto
# sta accanto a quello che aggiorna i battuti, e premerlo per sbaglio a meta'
# serata spegnerebbe il catalogo davanti a tutti.
#
# Fa due cose:
#   1. disattiva il workflow che rilegge Airtable ogni 5 minuti;
#   2. toglie `index.html` e `battuti.json` dal repository.
#
# **E' il secondo passo a spegnere il sito**, non un comando su GitHub Pages.
# Senza `index.html` l'indirizzo risponde 404, e il file sparisce anche da
# github.com — cosa necessaria, perche' il repo e' pubblico e a solo sito
# spento la pagina resterebbe comunque leggibile li' dentro, foto comprese.
#
# Pages resta configurato ma vuoto. Smontarlo davvero non e' possibile da qui:
# il token automatico di Actions non ha quel permesso e l'API risponde 403.
# La prima versione di questo workflow ci provava e, fallendo, stampava
# «risultava gia' spento»: sembrava tutto a posto mentre non lo era. Meglio
# non provarci e dire come stanno le cose. E' comunque ininfluente — un Pages
# senza pagine non serve a nessuno — e in cambio la riapertura e' immediata.
#
# **Si torna indietro con un comando solo.** Dal PC, `python pubblica.py`
# rimette la pagina e ripubblica: una decina di secondi. Il workflow dei
# battuti va invece riattivato a mano, da Actions -> «Aggiorna i titoli
# battuti» -> menu «...» -> Enable workflow. GitHub non consente di
# riaccenderlo dall'esterno, ed e' un bene: non puo' ripartire da solo.

name: Chiudi l'asta

on:
  workflow_dispatch:
    inputs:
      conferma:
        description: "Scrivi CHIUDI per confermare"
        required: true
        default: ""

permissions:
  actions: write     # per disattivare il workflow periodico
  contents: write    # per togliere la pagina dal repository

jobs:
  chiudi:
    runs-on: ubuntu-latest
    steps:
      - name: Verifica la conferma
        if: inputs.conferma != 'CHIUDI'
        run: |
          echo "::error::Confermare scrivendo CHIUDI. Non e' stato toccato niente."
          exit 1

      - uses: actions/checkout@v4

      - name: Ferma l'aggiornamento automatico
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT \
            "repos/${{ github.repository }}/actions/workflows/aggiorna-battuti.yml/disable"
          echo "Aggiornamento ogni 5 minuti: disattivato."

      - name: Ritira la pagina
        run: |
          rimossi=""
          for f in index.html battuti.json; do
            if [ -f "$f" ]; then git rm -q "$f"; rimossi="$rimossi $f"; fi
          done
          if [ -z "$rimossi" ]; then
            echo "La pagina era gia' stata ritirata: niente da fare."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "Asta conclusa: pagina ritirata$rimossi"
          git push
          echo "Rimossi dal repository:$rimossi"
          echo "Il sito rispondera' 404 entro una ventina di secondi."

      - name: Riepilogo
        run: |
          {
            echo "## Asta chiusa"
            echo ""
            echo "- aggiornamento automatico **fermo**"
            echo "- pagina **ritirata**: il sito risponde 404 e il file non e'"
            echo "  piu' leggibile nemmeno su github.com"
            echo ""
            echo "Per riaprire: \`python pubblica.py\` dal PC, poi riattiva"
            echo "«Aggiorna i titoli battuti» da Actions."
          } >> "$GITHUB_STEP_SUMMARY"
